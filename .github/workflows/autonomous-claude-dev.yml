name: Autonomous Claude Developer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  autonomous-fix:
    if: github.event.label.name == 'claude-bot'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN_PAT }}
          branch_prefix: claude/
          base_branch: master
          #show_full_output: true
          claude_args: |
            --model ${{ env.ANTHROPIC_MODEL }}
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*)
          prompt: |
            You are operating autonomously in a CI/CD sandbox to fix a GitHub Issue.

            **Issue Details:**
            - Title: ${{ github.event.issue.title }}
            - Description: ${{ github.event.issue.body }}
            - Issue #: ${{ github.event.issue.number }}

            **Your Task:**
            1. Explore the codebase using find/grep to locate relevant logic
            2. Formulate a multi-step execution plan
            3. Apply the code fixes
            4. Run the project's test suite to verify your fix doesn't break existing features
            5. Create a new branch named `claude/issue-${{ github.event.issue.number }}`
            6. Commit your changes with a clear message
            7. Push the branch to origin
            8. IMPORTANT: Create a pull request using this exact command:
               gh pr create --base master --title "🤖 [Claude AI] Fix for Issue #${{ github.event.issue.number }}" --body "Fixes #${{ github.event.issue.number }}\n\nThis is an automated pull request generated by Claude Code in response to the reported issue.\n\n**Changes Made:**\n- Applied automated fixes to resolve the issue\n- All tests pass successfully\n- Code follows project standards and guidelines\n\n**Automated by:** Claude Code AI"

            Make sure to execute this command - it is critical for the workflow to complete successfully.

            **Guidelines:**
            - Be thorough but efficient
            - Prioritize code quality and maintainability
            - Ensure all tests pass before completing
            - Add comments explaining non-obvious changes
